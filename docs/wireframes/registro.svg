<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       WIREFRAME: Registro (HU-04)
       Marco 1: estado normal | Marco 2: email inválido | Marco 3: API rechaza
       ============================================================ -->
  <rect width="1540" height="760" fill="#f7f7f7"/>

  <!-- ================= MARCO 1: NORMAL ================= -->
  <g transform="translate(20,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="70" y="70" font-size="16" font-weight="bold">Crear cuenta</text>
    <text x="24" y="76" font-size="13" text-decoration="underline">Volver</text>
    <circle cx="24" cy="56" r="11" fill="#000"/>
    <text x="24" y="60" font-size="11" fill="#fff" text-anchor="middle">1</text>

    <text x="24" y="116" font-size="14" font-weight="bold">Completá tus datos para registrarte</text>

    <rect x="24" y="140" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="162" font-size="11" fill="#777">Nombre</text>
    <text x="36" y="182" font-size="13">Walter</text>
    <circle cx="34" cy="140" r="11" fill="#000"/>
    <text x="34" y="144" font-size="11" fill="#fff" text-anchor="middle">2</text>

    <rect x="24" y="210" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="232" font-size="11" fill="#777">Email</text>
    <text x="36" y="252" font-size="13">walter@correo.com</text>
    <circle cx="34" cy="210" r="11" fill="#000"/>
    <text x="34" y="214" font-size="11" fill="#fff" text-anchor="middle">3</text>

    <rect x="24" y="280" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="302" font-size="11" fill="#777">Contraseña</text>
    <text x="36" y="322" font-size="13">••••••••</text>
    <circle cx="34" cy="280" r="11" fill="#000"/>
    <text x="34" y="284" font-size="11" fill="#fff" text-anchor="middle">4</text>

    <rect x="24" y="356" width="312" height="48" fill="#e6e6e6" stroke="#000" rx="24"/>
    <text x="180" y="385" font-size="14" font-weight="bold" text-anchor="middle">Registrarme</text>
    <circle cx="34" cy="356" r="11" fill="#000"/>
    <text x="34" y="360" font-size="11" fill="#fff" text-anchor="middle">5</text>

    <text x="180" y="438" font-size="13" text-anchor="middle" text-decoration="underline">Ya tengo cuenta. Iniciar sesión</text>
  </g>

  <!-- ================= MARCO 2: EMAIL INVALIDO ================= -->
  <g transform="translate(400,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="70" y="70" font-size="16" font-weight="bold">Crear cuenta</text>

    <rect x="24" y="140" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="182" font-size="13">Walter</text>

    <rect x="24" y="210" width="312" height="76" fill="none" stroke="#b00020" stroke-width="2" rx="6"/>
    <text x="36" y="232" font-size="11" fill="#b00020">Email</text>
    <text x="36" y="252" font-size="13">walter.correo</text>
    <text x="36" y="274" font-size="11" fill="#b00020">Ingresá un email válido (ejemplo: nombre@dominio.com).</text>
    <circle cx="34" cy="210" r="11" fill="#000"/>
    <text x="34" y="214" font-size="11" fill="#fff" text-anchor="middle">6</text>

    <rect x="24" y="306" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="348" font-size="13">••••••••</text>

    <rect x="24" y="382" width="312" height="48" fill="#dcdcdc" stroke="#999" rx="24"/>
    <text x="180" y="411" font-size="14" fill="#999" text-anchor="middle">Registrarme</text>
    <text x="180" y="456" font-size="11" fill="#666" text-anchor="middle">El botón está deshabilitado hasta corregir el email.</text>
    <circle cx="34" cy="382" r="11" fill="#000"/>
    <text x="34" y="386" font-size="11" fill="#fff" text-anchor="middle">7</text>
  </g>

  <!-- ================= MARCO 3: API RECHAZA ================= -->
  <g transform="translate(780,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="70" y="70" font-size="16" font-weight="bold">Crear cuenta</text>

    <rect x="24" y="140" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="182" font-size="13">Walter</text>
    <rect x="24" y="210" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="252" font-size="13">walter@correo.com</text>
    <rect x="24" y="280" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="322" font-size="13">••••••••</text>

    <rect x="24" y="356" width="312" height="48" fill="#e6e6e6" stroke="#000" rx="24"/>
    <text x="180" y="385" font-size="14" font-weight="bold" text-anchor="middle">Registrarme</text>

    <text x="180" y="436" font-size="12" text-anchor="middle" fill="#b00020">Ese email ya está registrado.</text>
    <text x="180" y="454" font-size="11" text-anchor="middle" fill="#666">Los datos cargados siguen en el formulario.</text>
    <circle cx="34" cy="424" r="11" fill="#000"/>
    <text x="34" y="428" font-size="11" fill="#fff" text-anchor="middle">8</text>
  </g>

  <!-- ================= MARCO 4: REGISTRANDO ================= -->
  <g transform="translate(1160,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="70" y="70" font-size="16" font-weight="bold">Crear cuenta</text>
    <text x="24" y="76" font-size="13" fill="#999">Volver</text>

    <rect x="24" y="140" width="312" height="56" fill="#f2f2f2" stroke="#999" rx="6"/>
    <text x="36" y="182" font-size="13" fill="#555">Walter</text>

    <rect x="24" y="210" width="312" height="56" fill="#f2f2f2" stroke="#999" rx="6"/>
    <text x="36" y="252" font-size="13" fill="#555">walter@correo.com</text>

    <rect x="24" y="280" width="312" height="56" fill="#f2f2f2" stroke="#999" rx="6"/>
    <text x="36" y="322" font-size="13" fill="#555">••••••••</text>

    <rect x="24" y="356" width="312" height="48" fill="#cfcfcf" stroke="#000" rx="24"/>
    <circle cx="118" cy="380" r="9" fill="none" stroke="#000" stroke-width="2"/>
    <text x="200" y="385" font-size="13" text-anchor="middle">Registrando...</text>
    <circle cx="34" cy="356" r="11" fill="#000"/>
    <text x="34" y="360" font-size="11" fill="#fff" text-anchor="middle">9</text>

    <text x="180" y="436" font-size="11" fill="#666" text-anchor="middle">Mientras se envía, los campos y "Volver"</text>
    <text x="180" y="452" font-size="11" fill="#666" text-anchor="middle">quedan deshabilitados.</text>
  </g>

  <text x="20" y="752" font-size="12" fill="#555">Registro · marco 1: normal · marco 2: email inválido · marco 3: la API rechaza el registro · marco 4: enviando</text>
</svg>
