<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       WIREFRAME: Inicio de sesión (HU-05)
       Marco 1: estado normal | Marco 2: cargando | Marco 3: error
       ============================================================ -->
  <rect width="1160" height="760" fill="#f7f7f7"/>

  <!-- ================= MARCO 1: NORMAL ================= -->
  <g transform="translate(20,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>

    <text x="180" y="90" font-size="22" font-weight="bold" text-anchor="middle">UNLaM Tuiter</text>
    <text x="180" y="114" font-size="12" text-anchor="middle" fill="#555">Iniciá sesión para ver el feed</text>

    <!-- Campo email -->
    <rect x="24" y="150" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="172" font-size="11" fill="#777">Email</text>
    <text x="36" y="192" font-size="13">usuario@correo.com</text>
    <circle cx="34" cy="150" r="11" fill="#000"/>
    <text x="34" y="154" font-size="11" fill="#fff" text-anchor="middle">1</text>

    <!-- Campo contraseña -->
    <rect x="24" y="220" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="242" font-size="11" fill="#777">Contraseña</text>
    <text x="36" y="262" font-size="13">••••••••</text>
    <circle cx="34" cy="220" r="11" fill="#000"/>
    <text x="34" y="224" font-size="11" fill="#fff" text-anchor="middle">2</text>

    <!-- Botón ingresar -->
    <rect x="24" y="296" width="312" height="48" fill="#e6e6e6" stroke="#000" rx="24"/>
    <text x="180" y="325" font-size="14" font-weight="bold" text-anchor="middle">Ingresar</text>
    <circle cx="34" cy="296" r="11" fill="#000"/>
    <text x="34" y="300" font-size="11" fill="#fff" text-anchor="middle">3</text>

    <!-- Link crear cuenta -->
    <text x="180" y="378" font-size="13" text-anchor="middle" text-decoration="underline">¿No tenés cuenta? Crear cuenta</text>
    <circle cx="34" cy="366" r="11" fill="#000"/>
    <text x="34" y="370" font-size="11" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- ================= MARCO 2: CARGANDO ================= -->
  <g transform="translate(400,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="180" y="90" font-size="22" font-weight="bold" text-anchor="middle">UNLaM Tuiter</text>

    <rect x="24" y="150" width="312" height="56" fill="#f2f2f2" stroke="#000" rx="6"/>
    <text x="36" y="192" font-size="13" fill="#555">usuario@correo.com</text>
    <rect x="24" y="220" width="312" height="56" fill="#f2f2f2" stroke="#000" rx="6"/>
    <text x="36" y="262" font-size="13" fill="#555">••••••••</text>

    <rect x="24" y="296" width="312" height="48" fill="#cfcfcf" stroke="#000" rx="24"/>
    <circle cx="140" cy="320" r="9" fill="none" stroke="#000" stroke-width="2"/>
    <text x="190" y="325" font-size="14" text-anchor="middle">Ingresando...</text>
    <circle cx="34" cy="296" r="11" fill="#000"/>
    <text x="34" y="300" font-size="11" fill="#fff" text-anchor="middle">5</text>
  </g>

  <!-- ================= MARCO 3: ERROR ================= -->
  <g transform="translate(780,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>

    <text x="180" y="90" font-size="22" font-weight="bold" text-anchor="middle">UNLaM Tuiter</text>

    <rect x="24" y="150" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="192" font-size="13">usuario@correo.com</text>
    <rect x="24" y="220" width="312" height="56" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="262" font-size="13">••••••••</text>

    <rect x="24" y="296" width="312" height="48" fill="#e6e6e6" stroke="#000" rx="24"/>
    <text x="180" y="325" font-size="14" font-weight="bold" text-anchor="middle">Ingresar</text>

    <text x="180" y="376" font-size="12" text-anchor="middle" fill="#b00020">Email o contraseña incorrectos.</text>
    <circle cx="34" cy="364" r="11" fill="#000"/>
    <text x="34" y="368" font-size="11" fill="#fff" text-anchor="middle">6</text>

    <text x="180" y="410" font-size="13" text-anchor="middle" text-decoration="underline">¿No tenés cuenta? Crear cuenta</text>
  </g>

  <text x="20" y="752" font-size="12" fill="#555">Login · marco 1: estado normal · marco 2: envío en curso · marco 3: credenciales incorrectas</text>
</svg>
