<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       WIREFRAME: Publicar post (HU-02, HU-03)
       Marco 1: normal | Marco 2: borrador guardado | Marco 3: error al publicar
       ============================================================ -->
  <rect width="1160" height="760" fill="#f7f7f7"/>

  <!-- ================= MARCO 1: NORMAL ================= -->
  <g transform="translate(20,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="24" y="74" font-size="13" text-decoration="underline">Volver</text>
    <text x="96" y="74" font-size="16" font-weight="bold">Nuevo post</text>
    <circle cx="24" cy="62" r="11" fill="#000"/>
    <text x="24" y="66" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <rect x="24" y="112" width="312" height="180" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="138" font-size="11" fill="#777">¿Qué estás pensando?</text>
    <text x="36" y="166" font-size="13">Demo final paso 19 publicado</text>
    <text x="36" y="186" font-size="13">desde el celular</text>
    <circle cx="34" cy="112" r="11" fill="#000"/>
    <text x="34" y="116" font-size="11" fill="#fff" text-anchor="middle">2</text>

    <rect x="24" y="320" width="150" height="46" fill="none" stroke="#000" rx="23"/>
    <text x="99" y="348" font-size="12" text-anchor="middle">Guardar borrador</text>
    <circle cx="34" cy="320" r="11" fill="#000"/>
    <text x="34" y="324" font-size="11" fill="#fff" text-anchor="middle">3</text>

    <rect x="186" y="320" width="150" height="46" fill="#e6e6e6" stroke="#000" rx="23"/>
    <text x="261" y="348" font-size="12" font-weight="bold" text-anchor="middle">Publicar</text>
    <circle cx="196" cy="320" r="11" fill="#000"/>
    <text x="196" y="324" font-size="11" fill="#fff" text-anchor="middle">4</text>

    <text x="24" y="396" font-size="11" fill="#666">Guardar borrador y Publicar se deshabilitan</text>
    <text x="24" y="412" font-size="11" fill="#666">si el campo está vacío.</text>
    <circle cx="14" cy="386" r="11" fill="#000"/>
    <text x="14" y="390" font-size="11" fill="#fff" text-anchor="middle">5</text>
  </g>

  <!-- ================= MARCO 2: BORRADOR GUARDADO ================= -->
  <g transform="translate(400,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="96" y="74" font-size="16" font-weight="bold">Nuevo post</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <rect x="24" y="112" width="312" height="180" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="166" font-size="13">Borrador persistente demo paso 19</text>

    <rect x="24" y="320" width="150" height="46" fill="none" stroke="#000" rx="23"/>
    <text x="99" y="348" font-size="12" text-anchor="middle">Guardar borrador</text>
    <rect x="186" y="320" width="150" height="46" fill="#e6e6e6" stroke="#000" rx="23"/>
    <text x="261" y="348" font-size="12" font-weight="bold" text-anchor="middle">Publicar</text>

    <text x="24" y="396" font-size="12" fill="#2e7d32">Borrador guardado</text>
    <circle cx="14" cy="386" r="11" fill="#000"/>
    <text x="14" y="390" font-size="11" fill="#fff" text-anchor="middle">6</text>

    <text x="24" y="424" font-size="11" fill="#666">Al volver a entrar (incluso tras cerrar la app)</text>
    <text x="24" y="440" font-size="11" fill="#666">el texto se recupera y dice "Borrador recuperado".</text>
  </g>

  <!-- ================= MARCO 3: ERROR AL PUBLICAR ================= -->
  <g transform="translate(780,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="96" y="74" font-size="16" font-weight="bold">Nuevo post</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <rect x="24" y="112" width="312" height="180" fill="none" stroke="#000" rx="6"/>
    <text x="36" y="166" font-size="13">Texto que el usuario escribió</text>
    <text x="36" y="186" font-size="13">(no se pierde si falla)</text>

    <rect x="24" y="320" width="150" height="46" fill="none" stroke="#000" rx="23"/>
    <text x="99" y="348" font-size="12" text-anchor="middle">Guardar borrador</text>
    <rect x="186" y="320" width="150" height="46" fill="#e6e6e6" stroke="#000" rx="23"/>
    <text x="261" y="348" font-size="12" font-weight="bold" text-anchor="middle">Publicar</text>

    <text x="24" y="396" font-size="12" fill="#b00020">Sin conexión a internet. Revisá tu red</text>
    <text x="24" y="412" font-size="12" fill="#b00020">e intentá de nuevo.</text>
    <circle cx="14" cy="386" r="11" fill="#000"/>
    <text x="14" y="390" font-size="11" fill="#fff" text-anchor="middle">7</text>

    <text x="24" y="440" font-size="11" fill="#666">Mientras se envía: spinner + "Publicando..."</text>
    <text x="24" y="456" font-size="11" fill="#666">y el botón Volver queda deshabilitado.</text>
    <circle cx="14" cy="430" r="11" fill="#000"/>
    <text x="14" y="434" font-size="11" fill="#fff" text-anchor="middle">8</text>
  </g>

  <text x="20" y="752" font-size="12" fill="#555">Publicar · marco 1: normal · marco 2: borrador guardado · marco 3: error al publicar</text>
</svg>
