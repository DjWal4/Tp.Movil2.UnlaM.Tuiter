<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       WIREFRAME: Usuarios favoritos (HU-08)
       Marco 1: lista con autores | Marco 2: lista vacía | Marco 3: quitar
       ============================================================ -->
  <rect width="1540" height="760" fill="#f7f7f7"/>

  <!-- ================= MARCO 1: LISTA ================= -->
  <g transform="translate(20,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>

    <text x="24" y="74" font-size="13" text-decoration="underline">Volver</text>
    <text x="96" y="74" font-size="16" font-weight="bold">Usuarios favoritos</text>
    <circle cx="24" cy="62" r="11" fill="#000"/>
    <text x="24" y="66" font-size="11" fill="#fff" text-anchor="middle">1</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <!-- Favorito 1 -->
    <circle cx="46" cy="140" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="146" font-size="14" font-weight="bold">Probe User</text>
    <text x="300" y="146" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <circle cx="46" cy="112" r="11" fill="#000"/>
    <text x="46" y="116" font-size="11" fill="#fff" text-anchor="middle">2</text>
    <circle cx="292" cy="134" r="11" fill="#000"/>
    <text x="292" y="138" font-size="11" fill="#fff" text-anchor="middle">3</text>
    <line x1="0" y1="174" x2="360" y2="174" stroke="#ccc"/>

    <!-- Favorito 2 -->
    <circle cx="46" cy="226" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="232" font-size="14" font-weight="bold">Walter</text>
    <text x="300" y="232" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <line x1="0" y1="260" x2="360" y2="260" stroke="#ccc"/>

    <!-- Favorito 3 -->
    <circle cx="46" cy="312" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="318" font-size="14" font-weight="bold">Test5</text>
    <text x="300" y="318" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <line x1="0" y1="346" x2="360" y2="346" stroke="#ccc"/>

    <text x="180" y="700" font-size="11" fill="#666" text-anchor="middle">La lista se lee de la base local: se ve igual sin internet.</text>
  </g>

  <!-- ================= MARCO 2: LISTA VACIA ================= -->
  <g transform="translate(400,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="24" y="74" font-size="13" text-decoration="underline">Volver</text>
    <text x="96" y="74" font-size="16" font-weight="bold">Usuarios favoritos</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <text x="180" y="340" font-size="34" text-anchor="middle">☆</text>
    <text x="180" y="378" font-size="13" text-anchor="middle">Todavía no tenés usuarios favoritos.</text>
    <text x="180" y="398" font-size="13" text-anchor="middle">Tocá la ☆ en un post del feed</text>
    <text x="180" y="416" font-size="13" text-anchor="middle">para agregarlos.</text>
    <circle cx="150" cy="310" r="11" fill="#000"/>
    <text x="150" y="314" font-size="11" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- ================= MARCO 3: QUITAR ================= -->
  <g transform="translate(780,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="24" y="74" font-size="13" text-decoration="underline">Volver</text>
    <text x="96" y="74" font-size="16" font-weight="bold">Usuarios favoritos</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <!-- Favorito 1 resaltado (se está por quitar) -->
    <rect x="0" y="104" width="360" height="70" fill="#f2f2f2"/>
    <circle cx="46" cy="140" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="146" font-size="14" font-weight="bold">Probe User</text>
    <text x="300" y="146" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <circle cx="292" cy="134" r="11" fill="#000"/>
    <text x="292" y="138" font-size="11" fill="#fff" text-anchor="middle">5</text>
    <line x1="0" y1="174" x2="360" y2="174" stroke="#ccc"/>

    <!-- Favorito 2 -->
    <circle cx="46" cy="226" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="232" font-size="14" font-weight="bold">Walter</text>
    <text x="300" y="232" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <line x1="0" y1="260" x2="360" y2="260" stroke="#ccc"/>

    <!-- Aviso de que desaparece -->
    <text x="180" y="330" font-size="12" fill="#555" text-anchor="middle">Al tocar "Quitar" el autor desaparece de la lista</text>
    <text x="180" y="348" font-size="12" fill="#555" text-anchor="middle">y no vuelve al reabrir la app.</text>
    <circle cx="150" cy="304" r="11" fill="#000"/>
    <text x="150" y="308" font-size="11" fill="#fff" text-anchor="middle">6</text>

    <text x="180" y="700" font-size="11" fill="#666" text-anchor="middle">La baja se guarda en Room (persistente).</text>
  </g>

  <!-- ================= MARCO 4: ERROR ================= -->
  <g transform="translate(1160,20)">
    <rect width="360" height="720" fill="#ffffff" stroke="#000000" stroke-width="2" rx="12"/>
    <text x="12" y="24" font-size="12" fill="#666">9:41</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000"/>
    <text x="24" y="74" font-size="13" text-decoration="underline">Volver</text>
    <text x="96" y="74" font-size="16" font-weight="bold">Usuarios favoritos</text>
    <line x1="0" y1="90" x2="360" y2="90" stroke="#000"/>

    <text x="16" y="120" font-size="12" fill="#b00020">No se pudieron leer los favoritos.</text>
    <circle cx="14" cy="108" r="11" fill="#000"/>
    <text x="14" y="112" font-size="11" fill="#fff" text-anchor="middle">7</text>

    <!-- Si la lista ya estaba cargada, se sigue mostrando. -->
    <circle cx="46" cy="180" r="22" fill="#ddd" stroke="#000"/>
    <text x="80" y="186" font-size="14" font-weight="bold">Probe User</text>
    <text x="300" y="186" font-size="12" text-decoration="underline" text-anchor="middle">Quitar</text>
    <line x1="0" y1="214" x2="360" y2="214" stroke="#ccc"/>

    <text x="180" y="700" font-size="11" fill="#666" text-anchor="middle">El error se avisa, pero no se borra la lista guardada.</text>
  </g>

  <text x="20" y="752" font-size="12" fill="#555">Favoritos · marco 1: lista · marco 2: lista vacía · marco 3: quitar un autor · marco 4: error de lectura local</text>
</svg>
